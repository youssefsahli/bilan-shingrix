name: Release

# Une étiquette v* : les binaires Linux et Windows, joints à la version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            suffix: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || true
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: The crate carries the tag's version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "$got" = "$want" ] || { echo "Cargo.toml : $got, l'étiquette dit $want" >&2; exit 1; }
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Rename
        shell: bash
        run: cp "target/release/bilan-shingrix${{ matrix.ext }}" "bilan-shingrix-${{ matrix.suffix }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.suffix }}
          if-no-files-found: error
          path: bilan-shingrix-${{ matrix.suffix }}${{ matrix.ext }}

  # Tout d'un coup, une fois les deux construits.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Bilan Shingrix $GITHUB_REF_NAME" --notes "Linux et Windows : un seul fichier, à lancer tel quel."
